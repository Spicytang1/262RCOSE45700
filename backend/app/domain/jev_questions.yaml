# Jev decisions 질문 문구.
# 보기 키는 taxonomy/v1.yaml 과 같아야 한다. 택소노미에 보기를 추가하지 않는다.
# 출발, 테이크오버·수동개입·완만한 감속, 라바콘/공사 시설을 대상으로 두는 보기는 없다.
# 한 녹음당 이 질문들을 한 번의 decisions 호출에 넣는다.

event_type:
  instructions: >
    자율주행 시험 차량 안전 감독관의 발화에서 주된 이슈 유형을 하나 고르세요.
    발화에 나오지 않은 유형을 만들지 마세요.
    어느 유형도 분명하지 않으면 other 를 고르고 확신을 낮추세요.
  criteria:
    sudden_brake: 선행 상황이나 장애물 때문에 차량이 갑자기 강하게 감속한 사건(급제동, 급브레이크). 완만한 감속은 해당하지 않습니다.
    cut_in: 다른 차량이 짧은 간격으로 앞으로 끼어든 사건(컷인, 끼어들기).
    two_wheeler_intrusion: 오토바이, 자전거, 킥보드 등 이륜차가 차선 안으로 갑자기 들어온 사건.
    illegal_parking_avoidance: 불법 주정차나 이중주차 차량을 피하려고 경로를 바꾼 사건.
    pedestrian_intrusion: 보행자가 차도나 경로 안으로 들어온 사건.
    construction_zone: 공사 구간, 라바콘, 차선 통제를 지나거나 피한 사건. 라바콘 자체는 대상 유형이 아닙니다.
    signal_issue: 신호등 인지, 신호 위반, 신호 불명확과 관련된 사건.
    other: 위 유형에 해당하지 않거나, 발화만으로 주된 유형을 정할 수 없는 경우.

severity:
  instructions: >
    발화에 드러난 위험만 보고 심각도를 고르세요.
    급정거나 충돌 위험을 말하지 않았으면 높음으로 올리지 마세요.
  criteria:
    low: 주행에 거의 영향이 없는 경미한 이슈.
    medium: 주의가 필요하지만 즉시 위험이라고 말하지 않은 이슈.
    high: 급정거, 충돌 위험 등 즉시 대응이 필요했다고 발화에 나온 이슈.

road_type:
  instructions: >
    이슈가 난 곳의 도로 모양을 고르세요.
    발화에 도로 모양이 없으면 가장 그럴듯한 보기로 채우지 말고 확신을 낮추세요.
  criteria:
    intersection: 교차로 안에서 난 이슈.
    curve: 곡선 구간에서 난 이슈.
    merge: 합류 구간에서 난 이슈.
    straight: 직선 구간에서 난 이슈.
    crosswalk: 횡단보도 주변에서 난 이슈.

ego_action_before:
  instructions: >
    이슈 직전에 내 차가 하던 동작을 고르세요.
    유턴은 좌회전과 다른 보기입니다. 출발은 보기가 아닙니다. 출발을 직진이나 정차로 바꿔 넣지 마세요.
    발화에 직전 동작이 없으면 확신을 낮추세요.
  criteria:
    going_straight: 이슈 직전에 직진하고 있었다.
    lane_change: 이슈 직전에 차선을 바꾸고 있었다.
    left_turn: 이슈 직전에 좌회전하고 있었다. 유턴은 좌회전이 아닙니다.
    right_turn: 이슈 직전에 우회전하고 있었다.
    u_turn: 이슈 직전에 유턴하고 있었다. 좌회전이나 우회전으로 바꾸지 마세요.
    stopped: 이슈 직전에 이미 정차해 있었다. 출발은 정차가 아닙니다.

target_type:
  instructions: >
    이슈의 대상을 고르세요.
    라바콘, 공사 자재, 차선 통제 시설은 차량·보행자·이륜차가 아니면 none 입니다.
    대상을 말하지 않았으면 none, 말했는데 종류가 불명확하면 unknown 입니다.
  criteria:
    vehicle: 다른 차량이 대상이다.
    pedestrian: 보행자가 대상이다.
    two_wheeler: 오토바이, 자전거, 킥보드 등 이륜차가 대상이다.
    none: 특정 대상이 없거나, 대상이 라바콘·공사 시설처럼 보기 밖이다.
    unknown: 대상이 있다고 했으나 종류를 확인하지 못했다.

ego_reaction:
  instructions: >
    이슈 이후 내 차가 보인 반응을 고르세요.
    급감속은 갑자기 강하게 줄어든 경우만입니다. 완만한 감속은 급감속이 아닙니다.
    테이크오버나 수동개입은 보기가 아닙니다. 그 말만 있으면 급감속·급가속·과조향·정차로 바꾸지 말고 확신을 낮추세요.
  criteria:
    hard_decel: 이슈 이후 갑자기 강하게 감속하거나 급제동했다.
    hard_accel: 이슈 이후 갑자기 가속했다.
    oversteer: 이슈 이후 조향이 과했다.
    stop: 이슈 이후 차가 멈췄다. 이미 서 있던 상태는 직전 동작의 정차입니다.
