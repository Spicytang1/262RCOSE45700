# 녹음 취소 의도. 사건 유형과 따로, 녹음마다 decisions 를 한 번 먼저 부른다.
# 단어가 아니라 의도로 판단한다. "취소할 뻔했다"처럼 신고 내용 안에 나온 말은 cancel 이 아니다.
# keywords 는 mock 분류기만 쓴다.
id: cancel_intent
label: 녹음 취소 의도
instructions: >
  자율주행 시험 차량 안전 감독관이 방금 녹음한 발화입니다.
  감독관이 이 녹음 자체를 취소하거나 지워 달라고 요청하는지 고르세요.
  "취소해", "삭제해 줘", "방금 거 지워"처럼 녹음을 없애 달라는 말일 때만 cancel 입니다.
  주행 상황을 설명하다가 취소, 삭제, 지우다 같은 단어가 나온 것은 cancel 이 아닙니다.
  신고 내용과 취소 요청이 함께 있으면 마지막에 녹음을 취소하겠다고 했는지를 보세요.
  애매하면 keep 을 고르고 확신을 낮추세요.
options:
  - key: cancel
    label: 취소
    criteria: 감독관이 이 녹음을 취소하거나 삭제해 달라고 요청한다. 예) "방금 거 취소해", "이거 삭제해 줘", "잘못 눌렀어 지워 줘".
    keywords: ["취소해", "취소할게", "취소 해", "삭제해", "삭제할게", "삭제 해", "지워 줘", "지워줘", "잘못 눌렀"]
  - key: keep
    label: 유지
    criteria: 주행 이슈를 신고하는 발화이거나, 취소·삭제 같은 단어가 상황 설명 안에만 나온다. 예) "끼어들어서 취소할 뻔했어", "차선 변경 취소하고 다시 들어갔어".
    keywords: []
