# 도메인 용어와 흔한 오인식. 목록은 운영 중 보강한다.
# fuzzy_threshold 는 자모 유사도. 1 이면 퍼지 치환을 하지 않는다.
fuzzy_threshold: 0.84
terms:
  - 라바콘
  - 컷인
  - 디스인게이지먼트
  - 갑툭튀
replacements:
  - from: "라바 콘"
    to: "라바콘"
  - from: "컷 인"
    to: "컷인"
  - from: "디스 인게이지먼트"
    to: "디스인게이지먼트"
  - from: "갑툭 튀"
    to: "갑툭튀"
  # 컷인해서 가 코딩/코린 으로 들린 경우. 개발 문맥이면 바꾸지 않는다.
  - from: "코딩해서"
    to: "컷인해서"
    requires_any: ["차", "끼어", "급", "승용", "트럭", "차선", "왼쪽", "오른쪽"]
    requires_none: ["프로그램", "파이썬", "개발", "코드", "앱", "소프트웨어"]
  - from: "코린에서"
    to: "컷인해서"
    requires_any: ["차", "끼어", "급", "승용", "트럭", "차선", "왼쪽", "오른쪽"]
    requires_none: ["프로그램", "파이썬", "개발", "코드", "앱", "소프트웨어"]
